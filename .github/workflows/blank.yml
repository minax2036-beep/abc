name: Generate TWRP Device Tree
on:
  workflow_dispatch:
    inputs:
      img_url:
        description: Direct URL
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y cpio git python3-pip lz4 && pip3 install twrpdtgen
      - run: wget -O target.img "${{ github.event.inputs.img_url }}"
      - name: Patch twrpdtgen for Android 16
        run: |
          python3 -c '
          import re, sebaubuntu_libs.libandroid.device_info as d, sebaubuntu_libs.libandroid.fstab as f
          with open(d.__file__, "r") as fp: s = fp.read()
          s = s.replace("self.first_api_level = self.get_first_prop(FIRST_API_LEVEL)", "self.first_api_level = \"36\"")
          with open(d.__file__, "w") as fp: fp.write(s)
          with open(f.__file__, "r") as fp: s = fp.read()
          s = re.sub(r"([ \t]+)src, mount_point, fs_type, mnt_flags, fs_flags = line\.split\(\)", r"\1parts = line.split()\n\1if len(parts) < 5: return None\n\1src, mount_point, fs_type, mnt_flags, fs_flags = parts[:5]", s)
          s = re.sub(r"([ \t]+)self\.entries\.append\(FstabEntry\.from_entry\(line\)\)", r"\1entry = FstabEntry.from_entry(line)\n\1if entry: self.entries.append(entry)", s)
          with open(f.__file__, "w") as fp: fp.write(s)
          '
      - run: python3 -m twrpdtgen target.img -o output
      - uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
