#name: Generate TWRP Device Tree
on:
  workflow_dispatch:
    inputs:
      img_url:
        description: Direct URL
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y cpio git python3-pip && pip3 install twrpdtgen
      - run: wget -O target.img "${{ github.event.inputs.img_url }}"
      - run: python3 -m twrpdtgen target.img -o output
      - uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
